<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aggcenter · Aggregation Center</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-2: #273449;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #a78bfa;
        --good: #34d399;
        --border: #334155;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      header {
        padding: 28px 36px 12px;
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      header h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
      header .tag {
        color: var(--muted);
        font-size: 14px;
      }
      header .status {
        margin-left: auto;
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); }
      main { padding: 12px 36px 48px; }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 26px;
      }
      .card {
        background: linear-gradient(160deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px;
      }
      .card .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
      .card .value { font-size: 32px; font-weight: 700; margin-top: 6px; }
      .card .value.accent { color: var(--accent); }
      .card .value.accent2 { color: var(--accent-2); }
      .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      .panel h2 { margin: 0 0 14px; font-size: 17px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
      td .pill {
        background: var(--panel-2);
        border: 1px solid var(--border);
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--accent);
      }
      form { display: grid; gap: 12px; }
      label { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
      input, select {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 9px;
        font-size: 14px;
      }
      button {
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #0b1220;
        border: none;
        padding: 11px 16px;
        border-radius: 9px;
        font-weight: 700;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover { filter: brightness(1.05); }
      .muted { color: var(--muted); font-size: 13px; }
      .num { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <header>
      <h1>aggcenter</h1>
      <span class="tag">Aggregation Center</span>
      <span class="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
    </header>
    <main>
      <section class="cards">
        <div class="card">
          <div class="label">Sources</div>
          <div class="value accent" id="stat-count">–</div>
        </div>
        <div class="card">
          <div class="label">Total value</div>
          <div class="value accent2 num" id="stat-total">–</div>
        </div>
        <div class="card">
          <div class="label">Average value</div>
          <div class="value num" id="stat-avg">–</div>
        </div>
        <div class="card">
          <div class="label">Categories</div>
          <div class="value" id="stat-categories">–</div>
        </div>
      </section>

      <section class="grid">
        <div class="panel">
          <h2>Registered sources</h2>
          <table>
            <thead>
              <tr><th>ID</th><th>Name</th><th>Category</th><th>Value</th></tr>
            </thead>
            <tbody id="sources-body">
              <tr><td colspan="4" class="muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="panel">
          <h2>Add a source</h2>
          <form id="add-form">
            <label>Name
              <input id="f-name" required placeholder="e.g. payments-api" />
            </label>
            <label>Category
              <input id="f-category" value="general" required />
            </label>
            <label>Value
              <input id="f-value" type="number" step="any" value="0" required />
            </label>
            <button type="submit">Register source</button>
            <span class="muted" id="form-msg"></span>
          </form>

          <h2 style="margin-top:22px;">By category</h2>
          <table>
            <thead>
              <tr><th>Category</th><th>Count</th><th>Total</th><th>Avg</th></tr>
            </thead>
            <tbody id="category-body">
              <tr><td colspan="4" class="muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const fmt = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });

      async function refresh() {
        try {
          const [aggRes, srcRes] = await Promise.all([
            fetch("/api/aggregate"),
            fetch("/api/sources"),
          ]);
          const agg = await aggRes.json();
          const sources = await srcRes.json();

          document.getElementById("stat-count").textContent = agg.source_count;
          document.getElementById("stat-total").textContent = fmt(agg.total_value);
          document.getElementById("stat-avg").textContent = fmt(agg.average_value);
          document.getElementById("stat-categories").textContent = agg.categories.length;

          document.getElementById("sources-body").innerHTML = sources
            .map(
              (s) =>
                `<tr><td>${s.id}</td><td>${s.name}</td><td><span class="pill">${s.category}</span></td><td class="num">${fmt(s.value)}</td></tr>`
            )
            .join("") || `<tr><td colspan="4" class="muted">No sources yet</td></tr>`;

          document.getElementById("category-body").innerHTML = agg.categories
            .map(
              (c) =>
                `<tr><td>${c.category}</td><td class="num">${c.count}</td><td class="num">${fmt(c.total)}</td><td class="num">${fmt(c.average)}</td></tr>`
            )
            .join("") || `<tr><td colspan="4" class="muted">No categories</td></tr>`;

          const health = await (await fetch("/api/health")).json();
          document.getElementById("status-text").textContent = `healthy · v${health.version}`;
        } catch (err) {
          document.getElementById("status-text").textContent = "disconnected";
        }
      }

      document.getElementById("add-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("form-msg");
        msg.textContent = "Saving…";
        const payload = {
          name: document.getElementById("f-name").value,
          category: document.getElementById("f-category").value,
          value: parseFloat(document.getElementById("f-value").value),
        };
        const res = await fetch("/api/sources", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          msg.textContent = "Source added ✓";
          document.getElementById("f-name").value = "";
          document.getElementById("f-value").value = "0";
          await refresh();
        } else {
          msg.textContent = "Failed to add source";
        }
      });

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
